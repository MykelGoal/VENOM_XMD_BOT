services:
  - type: web
    name: venom-xmd
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: BOT_NAME
        value: VENOM-XMD
      - key: PREFIX
        value: "."
      - key: NODE_VERSION
        value: "20.18.0"
